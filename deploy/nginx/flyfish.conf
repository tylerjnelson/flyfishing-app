# HTTP → HTTPS redirect
server {
  listen 80;
  server_name waflyfish.com;
  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl;
  server_name waflyfish.com;

  ssl_certificate /etc/letsencrypt/live/waflyfish.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/waflyfish.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;
  # ssl_stapling must NOT be present — Let's Encrypt dropped OCSP August 2025

  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.tile.openstreetmap.org data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

  # Frontend — React SPA built to /var/www/flyfish/dist
  root /var/www/flyfish/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    # try_files is required for React Router client-side routing
  }

  # CRITICAL: SSE streaming — buffering must be disabled or responses buffer until complete
  location ~ ^/api/chat {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;   # CRITICAL — must be off for SSE
    proxy_cache off;
    proxy_read_timeout 300s;   # 5 min — covers full LLM response at CPU speeds
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  # Email-sending endpoint — the actual abuse vector. Keep the strict auth
  # limit here ONLY (exact match wins over the /api/auth/ prefix below).
  location = /api/auth/magic-link {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # User-driven auth (verify / refresh / logout) — must never be starved by the
  # strict email limit. Use the generous api zone (60 r/m) instead.
  location /api/auth/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20M;  # note image uploads
  }
}
