# Fly Fish rate-limit zones.
#
# Included into the nginx http{} context via /etc/nginx/conf.d/*.conf.
# Kept in a discrete app-owned file (rather than inline in the distro
# nginx.conf) so it is git-tracked and drift-checked like the rest of deploy/.
#
# Applied in sites-available/flyfish (deploy/nginx/flyfish.conf):
#   location = /api/auth/magic-link  -> zone=auth  (strict; the email-send
#                                        abuse vector — one link/12s + burst 3)
#   location /api/auth/  (verify /    -> zone=api   (user-driven; must never be
#     refresh / logout)                  starved by the strict email limit)
#
# History: verify/refresh/logout used to share zone=auth, which starved the
# sign-in verify request (503 -> looked like an expired link). See the auth
# rate-limit incident, 2026-07-26.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
